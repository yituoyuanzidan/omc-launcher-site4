# macOS 版构建（GitHub Actions）
#
# 为什么要用 CI：PyInstaller 不能交叉编译，macOS 包只能在 macOS 上打。
# 源码放在仓库根目录的 omc-src.zip 里，这里解压再构建。
#
# 注意：不要用 macOS 自带的 unzip 解压这个包——zip 里有中文目录名
# （assets/avatars/二次元 等），Info-ZIP 会直接报 Illegal byte sequence。
# Python 的 zipfile 能正确识别 UTF-8 文件名标志，所以这里用 Python 解压。
#
# 产出：Actions 页面 Artifacts 里的 OMC-macos-arm64 / OMC-macos-x64（含版本号的 zip）。
#
# Gatekeeper：未签名公证的 .app，用户首次右键「打开」或在系统设置里点“仍要打开”即可。
# 要彻底免这一步需要 Apple Developer 证书。
name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "omc-src.zip"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            tag: arm64
          - runner: macos-15-intel
            tag: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack source
        run: |
          python -c "import zipfile;zipfile.ZipFile('omc-src.zip').extractall('src')"
          echo "--- top level:"; ls src
          echo "--- py files:"; find src -name "*.py" | wc -l
          echo "--- avatars:"; ls src/assets/avatars

      - name: Install deps
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.12.0" pyinstaller pillow qrcode
          python -c "import platform,sys;print('arch=',platform.machine(),'py=',sys.version)"

      - name: Build .app
        working-directory: src
        run: python -m PyInstaller --noconfirm --clean OMC.spec

      - name: Verify bundle
        working-directory: src
        run: |
          ls -la dist
          test -d "dist/OMC.app" || (echo "OMC.app 没生成"; exit 1)
          ls -la "dist/OMC.app/Contents/MacOS"
          du -sh "dist/OMC.app"

      - name: Smoke run (offscreen)
        working-directory: src
        run: |
          cd "dist/OMC.app/Contents/MacOS"
          QT_QPA_PLATFORM=offscreen timeout 20 ./OMC > /tmp/smoke.log 2>&1 || echo "exit=$?"
          echo "--- log tail:"; tail -20 /tmp/smoke.log

      - name: Zip with ditto
        working-directory: src
        run: |
          python - > ver.txt <<'PY'
          import io
          import re
          d = io.open('core/update.py', encoding='utf-8').read()
          m = re.search(r'VERSION\s*=\s*"([^"]+)"', d)
          print(m.group(1) if m else '1.0')
          PY
          VER=$(cat ver.txt | tr -d '\r\n')
          echo "VER=$VER" >> $GITHUB_ENV
          echo "ver=$VER"
          ditto -c -k --sequesterRsrc --keepParent "dist/OMC.app" "OMC-macOS-${{ matrix.tag }}-$VER.zip"
          ls -lh OMC-macOS-*.zip
          shasum -a 256 OMC-macOS-*.zip | tee sha.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OMC-macos-${{ matrix.tag }}
          path: |
            src/OMC-macOS-${{ matrix.tag }}-*.zip
            src/sha.txt
            src/ver.txt
          retention-days: 90
          if-no-files-found: error

      # 同时发到 Release：资源是公开直链，别人不用登录 GitHub 也能直接下载
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-${{ matrix.tag }}-v${{ env.VER }}
          name: OMC macOS ${{ env.VER }} (${{ matrix.tag }})
          body: |
            OMC 启动器 macOS ${{ matrix.tag }} 版，版本号 ${{ env.VER }}。
            解压后把 OMC.app 拖进「应用程序」。没做 Apple 签名/公证，
            首次打开请在 Finder 里右键 → 打开，或在「系统设置 → 隐私与安全性」里点“仍要打开”。
          files: src/OMC-macOS-${{ matrix.tag }}-*.zip
          fail_on_unmatched_files: true
